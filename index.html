<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KatBot · V4</title>
<style>
  :root{
    --bg: #05050a;
    --bg-soft: #0d0d16;
    --line: #22222f;
    --pink: #ff6fae;
    --pink-dim: #ff6fae55;
    --violet: #9d7bff;
    --text: #ecebf2;
    --text-dim: #8a89a0;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height:100%;
  }

  body{
    background-image:
      radial-gradient(circle at 15% 0%, #ff6fae14, transparent 40%),
      radial-gradient(circle at 85% 10%, #9d7bff14, transparent 40%);
  }

  header{
    padding: 64px 24px 32px;
    text-align:center;
    position:relative;
  }

  .kicker{
    font-size: 12px;
    letter-spacing: .35em;
    text-transform:uppercase;
    color: var(--pink);
    margin-bottom: 14px;
  }

  h1{
    font-size: clamp(2.4rem, 6vw, 4rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #fff 30%, var(--pink) 70%, var(--violet) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .sub{
    margin-top: 12px;
    color: var(--text-dim);
    font-size: 15px;
  }

  .sub b{ color: var(--text); }

  .search-wrap{
    max-width: 480px;
    margin: 32px auto 0;
    padding: 0 24px;
  }

  #search{
    width:100%;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 13px 22px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }

  #search:focus{
    border-color: var(--pink-dim);
    box-shadow: 0 0 0 4px #ff6fae1a;
  }

  #search::placeholder{ color: var(--text-dim); }

  nav{
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content:center;
    max-width: 900px;
    margin: 28px auto 0;
    padding: 0 24px;
  }

  nav button{
    background: var(--bg-soft);
    border: 1px solid var(--line);
    color: var(--text-dim);
    font-size: 12.5px;
    padding: 7px 14px;
    border-radius: 999px;
    cursor:pointer;
    transition: all .15s;
    white-space: nowrap;
  }

  nav button:hover{ color: var(--text); border-color: #3a3a4d; }

  nav button.active{
    background: var(--pink);
    border-color: var(--pink);
    color: #1a0510;
    font-weight:600;
  }

  main{
    max-width: 1000px;
    margin: 0 auto;
    padding: 48px 24px 100px;
    display: grid;
    gap: 28px;
  }

  section.category{
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow:hidden;
  }

  .cat-head{
    display:flex;
    align-items:center;
    gap: 12px;
    padding: 18px 22px;
    border-bottom: 1px solid var(--line);
  }

  .cat-emoji{
    font-size: 20px;
    width: 38px;
    height: 38px;
    display:flex;
    align-items:center;
    justify-content:center;
    background: #ffffff08;
    border-radius: 10px;
    flex-shrink:0;
  }

  .cat-title{ font-size: 16px; font-weight:700; }
  .cat-desc{ font-size: 12.5px; color: var(--text-dim); margin-top:2px; }

  .cmd-list{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  }

  .cmd{
    padding: 14px 22px;
    border-bottom: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }

  .cmd-name{
    font-family: 'SFMono-Regular', Consolas, monospace;
    font-size: 13px;
    color: var(--pink);
    font-weight:600;
  }

  .cmd-desc{
    font-size: 12.5px;
    color: var(--text-dim);
    margin-top: 4px;
    line-height:1.4;
  }

  .cmd.hidden{ display:none; }
  section.category.hidden{ display:none; }

  footer{
    text-align:center;
    padding: 30px 24px 60px;
    color: var(--text-dim);
    font-size: 12px;
    letter-spacing:.05em;
  }

  footer span{ color: var(--pink); }

  #empty-state{
    display:none;
    text-align:center;
    color: var(--text-dim);
    padding: 60px 24px;
    font-size: 14px;
  }
</style>
</head>
<body>

const nav = document.getElementById('cat-nav');
const main = document.getElementById('main');
const emptyState = document.getElementById('empty-state');

const allBtn = document.createElement('button');
allBtn.textContent = 'Todos';
allBtn.className = 'active';
allBtn.dataset.cat = 'all';
nav.appendChild(allBtn);

data.forEach(cat => {
  const btn = document.createElement('button');
  btn.textContent = cat.emoji + ' ' + cat.title;
  btn.dataset.cat = cat.title;
  nav.appendChild(btn);
});

data.forEach(cat => {
  const section = document.createElement('section');
  section.className = 'category';
  section.dataset.cat = cat.title;

  section.innerHTML = `
    <div class="cat-head">
      <div class="cat-emoji">${cat.emoji}</div>
      <div>
        <div class="cat-title">${cat.title}</div>
        <div class="cat-desc">${cat.desc}</div>
      </div>
    </div>
    <div class="cmd-list">
      ${cat.cmds.map(([name, desc]) => `
        <div class="cmd" data-name="${name.toLowerCase()}" data-desc="${desc.toLowerCase()}">
          <div class="cmd-name">${name}</div>
          <div class="cmd-desc">${desc}</div>
        </div>
      `).join('')}
    </div>
  `;
  main.appendChild(section);
});

nav.addEventListener('click', e => {
  if(e.target.tagName !== 'BUTTON') return;
  nav.querySelectorAll('button').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  const cat = e.target.dataset.cat;
  document.querySelectorAll('section.category').forEach(sec => {
    sec.classList.toggle('hidden', cat !== 'all' && sec.dataset.cat !== cat);
  });
  document.getElementById('search').value = '';
  filterSearch('');
});

function filterSearch(q){
  q = q.trim().toLowerCase();
  let anyVisible = false;

  document.querySelectorAll('section.category').forEach(sec => {
    let sectionHasMatch = false;
    sec.querySelectorAll('.cmd').forEach(cmd => {
      const match = q === '' || cmd.dataset.name.includes(q) || cmd.dataset.desc.includes(q);
      cmd.classList.toggle('hidden', !match);
      if(match) sectionHasMatch = true;
    });
    if(q !== ''){
      sec.classList.toggle('hidden', !sectionHasMatch);
    }
    if(sectionHasMatch) anyVisible = true;
  });

  emptyState.style.display = (q !== '' && !anyVisible) ? 'block' : 'none';
}

document.getElementById('search').addEventListener('input', e => {
  nav.querySelectorAll('button').forEach(b => b.classList.remove('active'));
  nav.querySelector('[data-cat="all"]').classList.add('active');
  document.querySelectorAll('section.category').forEach(sec => sec.classList.remove('hidden'));
  filterSearch(e.target.value);
});
